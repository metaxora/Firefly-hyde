name: Dispatch one approved production release

on:
  push:
    branches: [migration/instabox]
    paths: ['.github/workflows/instabox-release-dispatch.yml']

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'metaxora/Firefly-hyde' && contains(github.event.head_commit.message, '[instabox-release-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify baselines and dispatch one manual production build
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_BUILD_ENABLED: ${{ vars.INSTABOX_AUTO_BUILD_ENABLED }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          assert os.environ.get("AUTO_BUILD_ENABLED") != "true", "Automatic builds must remain disabled"
          base="https://api.github.com/repos/metaxora/Firefly-hyde"
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"firefly-release-dispatch"}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=30) as response:
                  return json.load(response)
          source=get("/git/ref/heads/main")["object"]["sha"]
          previous=get("/git/ref/heads/blog-deploy")["object"]["sha"]
          assert source == "d80dfe63dbf3bcc69aef04568c2039d06a35a2f8", "main changed; inspect before publishing"
          assert previous == "b790010a1e1cc2fe65fd094c436ae5d4cd8783f6", "Production branch changed; inspect before publishing"
          runs=get("/actions/workflows/build.yml/runs?branch=main&per_page=10")["workflow_runs"]
          assert not any(r["status"] != "completed" for r in runs), "Another main build is active"
          print("Approved main source: "+source)
          print("Previous production branch: "+previous)
          print("Automatic builds remain disabled")
          request=urllib.request.Request(base+"/actions/workflows/build.yml/dispatches",data=json.dumps({"ref":"main","inputs":{"publish":"true"}}).encode(),headers=dict(headers,**{"Content-Type":"application/json"}),method="POST")
          with urllib.request.urlopen(request,timeout=30) as response:
              assert response.status == 204
          print("Dispatched exactly one build.yml run on main with publish=true")
          PY
