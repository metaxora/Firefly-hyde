name: Build Blog

on:
  push:
    branches: [main]
    paths-ignore:
      - src/data/friends-latency-snapshot.json
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-blog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Astro check
        run: pnpm check
      - name: TypeScript check
        if: success() || failure()
        run: pnpm type-check

  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm build
      - name: Check homepage
        run: test -s dist/index.html
      - name: Save website files
        uses: actions/upload-artifact@v7
        with:
          name: blog-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
