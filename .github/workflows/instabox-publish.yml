name: Sign and publish InstaBox build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        required: true
        type: string
      build_run_attempt:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      channel:
        required: true
        type: choice
        default: candidate
        options: [candidate, production]

permissions:
  contents: read

concurrency:
  group: instabox-signing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'metaxora/Firefly-hyde' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify private build and sign static data
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          BLOG_SIGNING_PRIVATE_KEY: ${{ secrets.BLOG_SIGNING_PRIVATE_KEY }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          BUILD_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PRODUCTION_ENABLED: ${{ vars.INSTABOX_PRODUCTION_ENABLED || 'false' }}
        run: python3 -B scripts/deploy/publish_instabox.py
