name: Verify automatic publishing configuration
on:
  push:
    branches: [migration/instabox]
    paths: ['.github/workflows/verify-auto-publishing.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'metaxora/Firefly-hyde' && contains(github.event.head_commit.message, '[verify-auto-publishing]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify repository variable and main workflow wiring
        env:
          AUTO_BUILD_ENABLED: ${{ vars.INSTABOX_AUTO_BUILD_ENABLED }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          enabled=os.environ.get("AUTO_BUILD_ENABLED") == "true"
          print("Repository variable matches lowercase true: "+str(enabled))
          assert enabled, "INSTABOX_AUTO_BUILD_ENABLED does not equal true"
          base="https://raw.githubusercontent.com/metaxora/Firefly-hyde/main/"
          with urllib.request.urlopen(base+".github/workflows/build.yml",timeout=30) as response:
              workflow=response.read(100000).decode()
          assert "vars.INSTABOX_AUTO_BUILD_ENABLED == 'true'" in workflow
          assert "branches: [main]" in workflow
          assert "github.event_name == 'push' || inputs.publish" in workflow
          with urllib.request.urlopen(base+"scripts/deploy/instabox-config.json",timeout=30) as response:
              config=json.load(response)
          assert config["machine_id"] == "m_agqxotxgzkyg7lawsooh5fr2hi"
          print("INSTABOX_AUTO_BUILD_ENABLED=true")
          print("main push is wired to InstaBox build and GitHub signing/publication")
          print("Build machine: zero-forge ("+config["machine_id"]+")")
          print("Configuration verified; no build or production publication was triggered")
          PY
