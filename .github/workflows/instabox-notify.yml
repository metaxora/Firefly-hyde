name: Request blog signing

on:
  workflow_run:
    workflows: [Build on InstaBox]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: github.repository == 'metaxora/blog-source' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'metaxora/blog-source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify completed build and request signing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'candidate' }}
        run: python3 -B scripts/deploy/notify_release.py
